name: Patch homepage image preload
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = "        renderList();\n\n        function copyToClipboard(element) {"
          insert = '''        renderList();\n\n        // 首页加载稳定后，在后台预热详情页图片，避免进入详情页或快速滚动时出现空白占位。\n        function preloadDetailImagesFromHome() {\n            const urls = [\n                ...Array.from({ length: 14 }, (_, i) => `pj1/${i + 1}.jpg`),\n                ...Array.from({ length: 47 }, (_, i) => `pj2/${String(i + 1).padStart(2, '0')}.jpg`),\n                ...Array.from({ length: 31 }, (_, i) => `pj3/${i + 49}.jpg`)\n            ];\n\n            let index = 0;\n            const warmBatch = () => {\n                for (let i = 0; i < 4 && index < urls.length; i++, index++) {\n                    const image = new Image();\n                    image.decoding = 'async';\n                    image.src = `./${urls[index]}`;\n                }\n\n                if (index < urls.length) {\n                    if ('requestIdleCallback' in window) {\n                        requestIdleCallback(warmBatch, { timeout: 1000 });\n                    } else {\n                        setTimeout(warmBatch, 200);\n                    }\n                }\n            };\n\n            warmBatch();\n        }\n\n        // 不阻塞首页首屏：页面稳定后再开始后台预热。\n        setTimeout(preloadDetailImagesFromHome, 1800);\n\n        function copyToClipboard(element) {'''
          if marker not in s:
              raise SystemExit('marker not found')
          if 'function preloadDetailImagesFromHome()' in s:
              raise SystemExit('already patched')
          p.write_text(s.replace(marker, insert, 1))
          PY
      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add homepage background preload for detail images"
          git push
