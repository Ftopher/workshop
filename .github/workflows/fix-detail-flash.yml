name: Fix detail page image flash

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix detail reveal timing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''                let imgHtml = '';
                images.forEach(img => {
                    imgHtml += `<img src="./${img}" class="erp-detail-img w-full h-auto bg-[#E8E5DF] block" alt="${img}" loading="lazy">`;
                });'''
          new = '''                let imgHtml = '';
                images.forEach((img, index) => {
                    const loading = index === 0 ? 'eager' : 'lazy';
                    imgHtml += `<img src="./${img}" class="erp-detail-img w-full h-auto bg-[#E8E5DF] block" alt="${img}" loading="${loading}">`;
                });'''
          if old not in s:
              raise SystemExit('image rendering block not found')
          s = s.replace(old, new, 1)

          old2 = '''            // 详情页解除 DOM 隐藏，再触发淡入
            detailView.style.display = 'block';
            setTimeout(() => {
                detailView.classList.remove('view-hidden');
                detailView.classList.add('view-visible');
                
                // 返回按钮渐显
                backLayer.classList.remove('opacity-0');
                backLayer.classList.add('opacity-100');
            }, 50);'''
          new2 = '''            // 详情页先保持隐藏，等首张大图完成加载/解码后再淡入。
            // 防止图片尚未撑开页面高度时，End 短暂出现在视口中。
            detailView.style.display = 'block';

            const revealDetail = () => {
                detailView.classList.remove('view-hidden');
                detailView.classList.add('view-visible');

                backLayer.classList.remove('opacity-0');
                backLayer.classList.add('opacity-100');
            };

            const firstImage = heroWrapper.querySelector('img');
            if (!firstImage) {
                revealDetail();
            } else if (firstImage.complete) {
                if (typeof firstImage.decode === 'function') {
                    firstImage.decode().catch(() => {}).finally(revealDetail);
                } else {
                    revealDetail();
                }
            } else {
                let revealed = false;
                const revealOnce = () => {
                    if (revealed) return;
                    revealed = true;
                    revealDetail();
                };

                firstImage.addEventListener('load', () => {
                    if (typeof firstImage.decode === 'function') {
                        firstImage.decode().catch(() => {}).finally(revealOnce);
                    } else {
                        revealOnce();
                    }
                }, { once: true });
                firstImage.addEventListener('error', revealOnce, { once: true });
                setTimeout(revealOnce, 1500);
            }'''
          if old2 not in s:
              raise SystemExit('detail reveal block not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix detail page image flash' || exit 0
          git push
