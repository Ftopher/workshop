name: Fix detail page image flash

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix detail reveal timing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''                let imgHtml = '';\n                images.forEach(img => {\n                    imgHtml += `<img src="./${img}" class="erp-detail-img w-full h-auto bg-[#E8E5DF] block" alt="${img}" loading="lazy">`;\n                });'''
          new = '''                let imgHtml = '';\n                images.forEach((img, index) => {\n                    const loading = index === 0 ? 'eager' : 'lazy';\n                    imgHtml += `<img src="./${img}" class="erp-detail-img w-full h-auto bg-[#E8E5DF] block" alt="${img}" loading="${loading}">`;\n                });'''
          if old not in s:\n              raise SystemExit('image rendering block not found')\n          s = s.replace(old, new, 1)

          old2 = '''            // 详情页解除 DOM 隐藏，再触发淡入\n            detailView.style.display = 'block';\n            setTimeout(() => {\n                detailView.classList.remove('view-hidden');\n                detailView.classList.add('view-visible');\n                \n                // 返回按钮渐显\n                backLayer.classList.remove('opacity-0');\n                backLayer.classList.add('opacity-100');\n            }, 50);'''
          new2 = '''            // 详情页先保持隐藏，等首张大图完成加载/解码后再淡入。\n            // 这样不会先看到只有 End 的短页面，再因图片加载而把 End 推下去。\n            detailView.style.display = 'block';\n\n            const revealDetail = () => {\n                detailView.classList.remove('view-hidden');\n                detailView.classList.add('view-visible');\n\n                // 返回按钮渐显\n                backLayer.classList.remove('opacity-0');\n                backLayer.classList.add('opacity-100');\n            };\n\n            const firstImage = heroWrapper.querySelector('img');\n            if (!firstImage) {\n                revealDetail();\n            } else if (firstImage.complete) {\n                if (typeof firstImage.decode === 'function') {\n                    firstImage.decode().catch(() => {}).finally(revealDetail);\n                } else {\n                    revealDetail();\n                }\n            } else {\n                let revealed = false;\n                const revealOnce = () => {\n                    if (revealed) return;\n                    revealed = true;\n                    revealDetail();\n                };\n\n                firstImage.addEventListener('load', () => {\n                    if (typeof firstImage.decode === 'function') {\n                        firstImage.decode().catch(() => {}).finally(revealOnce);\n                    } else {\n                        revealOnce();\n                    }\n                }, { once: true });\n                firstImage.addEventListener('error', revealOnce, { once: true });\n\n                // 极端网络情况下最多等 1.5 秒，避免详情页被无限卡住。\n                setTimeout(revealOnce, 1500);\n            }'''
          if old2 not in s:\n              raise SystemExit('detail reveal block not found')\n          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')\n          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix detail page image flash' || exit 0
          git push
