name: Fix detail page image flash

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix detail reveal timing
        run: |
          python -c 'from pathlib import Path; import re; p=Path("index.html"); s=p.read_text(encoding="utf-8"); s=s.replace("images.forEach(img => {\\n                    imgHtml += `<img src=\"./${img}\" class=\"erp-detail-img w-full h-auto bg-[#E8E5DF] block\" alt=\"${img}\" loading=\"lazy\">`;\\n                });", "images.forEach((img, index) => {\\n                    const loading = index === 0 ? \'eager\' : \'lazy\';\\n                    imgHtml += `<img src=\"./${img}\" class=\"erp-detail-img w-full h-auto bg-[#E8E5DF] block\" alt=\"${img}\" loading=\"${loading}\">`;\\n                });", 1); pattern=r"            detailView\\.style\\.display = \'block\';\\s*setTimeout\\(\\(\\) => \\{\\s*detailView\\.classList\\.remove\\(\'view-hidden\'\\);\\s*detailView\\.classList\\.add\\(\'view-visible\'\\);\\s*// 返回按钮渐显\\s*backLayer\\.classList\\.remove\\(\'opacity-0\'\\);\\s*backLayer\\.classList\\.add\\(\'opacity-100\'\\);\\s*\\}, 50\\);"; replacement="""            // 详情页先保持隐藏，等首张大图完成加载/解码后再淡入，避免 End 闪现。\n            detailView.style.display = \'block\';\n\n            const revealDetail = () => {\n                detailView.classList.remove(\'view-hidden\');\n                detailView.classList.add(\'view-visible\');\n\n                backLayer.classList.remove(\'opacity-0\');\n                backLayer.classList.add(\'opacity-100\');\n            };\n\n            const firstImage = heroWrapper.querySelector(\'img\');\n            if (!firstImage) {\n                revealDetail();\n            } else if (firstImage.complete) {\n                if (typeof firstImage.decode === \'function\') {\n                    firstImage.decode().catch(() => {}).finally(revealDetail);\n                } else {\n                    revealDetail();\n                }\n            } else {\n                let revealed = false;\n                const revealOnce = () => {\n                    if (revealed) return;\n                    revealed = true;\n                    revealDetail();\n                };\n\n                firstImage.addEventListener(\'load\', () => {\n                    if (typeof firstImage.decode === \'function\') {\n                        firstImage.decode().catch(() => {}).finally(revealOnce);\n                    } else {\n                        revealOnce();\n                    }\n                }, { once: true });\n                firstImage.addEventListener(\'error\', revealOnce, { once: true });\n                setTimeout(revealOnce, 1500);\n            }"""; s,n=re.subn(pattern,replacement,s,count=1,flags=re.S); assert n==1, "detail reveal block not found"; p.write_text(s,encoding="utf-8")'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix detail page image flash' || exit 0
          git push
