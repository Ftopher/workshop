name: Fix project 1 image flash
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''                images.forEach((img, index) => {\n                    imgHtml += `<img src="./${img}" class="erp-detail-img w-full h-auto bg-[#E8E5DF] block" alt="${img}" loading="eager" decoding="async"${index === 0 ? ' fetchpriority="high"' : ''}>`;\n                });'''
          new = '''                images.forEach((img, index) => {\n                    const isProjectOne = id === 1;\n                    const decodeMode = isProjectOne ? 'sync' : 'async';\n                    const priority = isProjectOne || index === 0 ? ' fetchpriority="high"' : '';\n                    imgHtml += `<img src="./${img}" class="erp-detail-img w-full h-auto block" alt="${img}" loading="eager" decoding="${decodeMode}"${priority}>`;\n                });'''
          if old not in s:
              raise SystemExit('target image template not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Prevent project 1 long image flash during fast scroll"
          git push
