name: Update pj1 image 10 paths

on:
  push:
    paths:
      - '.github/workflows/.pj1-10-trigger'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update image paths and preload list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = """                    'pj1/9.jpg',\n                    'pj1/10.jpg',\n                    'pj1/11.jpg',"""
          new = """                    'pj1/9.jpg',\n                    'pj1/10-1.jpg',\n                    'pj1/10-2.jpg',\n                    'pj1/10-3.jpg',\n                    'pj1/11.jpg',"""
          if old not in s:
              raise SystemExit('detail image list pattern not found')
          s = s.replace(old, new, 1)

          old_preload = """                ...Array.from({ length: 12 }, (_, i) => `pj1/${i + 1}.jpg`),\n                'pj1/13-1.jpg',"""
          new_preload = """                ...Array.from({ length: 9 }, (_, i) => `pj1/${i + 1}.jpg`),\n                'pj1/10-1.jpg',\n                'pj1/10-2.jpg',\n                'pj1/10-3.jpg',\n                'pj1/11.jpg',\n                'pj1/12.jpg',\n                'pj1/13-1.jpg',"""
          if old_preload not in s:
              raise SystemExit('preload list pattern not found')
          s = s.replace(old_preload, new_preload, 1)

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update project 1 image 10 paths' || exit 0
          git push
