name: test-progressive-images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[progressive-preload]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """                images.forEach((img, index) => {\n                    const loading = index === 0 ? 'eager' : 'lazy';\n                    imgHtml += `<img src=\"./${img}\" class=\"erp-detail-img w-full h-auto bg-[#E8E5DF] block\" alt=\"${img}\" loading=\"${loading}\">`;\n                });"""
          new = """                images.forEach((img, index) => {\n                    const loading = index < 4 ? 'eager' : 'lazy';\n                    imgHtml += `<img src=\"./${img}\" class=\"erp-detail-img w-full h-auto bg-[#E8E5DF] block\" alt=\"${img}\" loading=\"${loading}\" data-detail-index=\"${index}\">`;\n                });"""
          if old not in s:
              raise SystemExit('image template not found')
          s = s.replace(old, new, 1)

          marker = """            if (!firstImage) {\n                revealDetail();\n            } else if (firstImage.complete) {"""
          insert = """            const detailImages = Array.from(heroWrapper.querySelectorAll('img'));
            let preloadedUntil = Math.min(4, detailImages.length);

            const preloadBatch = (count = 4) => {
                const start = preloadedUntil;
                const end = Math.min(start + count, detailImages.length);
                for (let i = start; i < end; i++) {
                    const img = detailImages[i];
                    if (img.dataset.preloadStarted === '1') continue;
                    img.dataset.preloadStarted = '1';
                    const probe = new Image();
                    probe.decoding = 'async';
                    probe.src = img.currentSrc || img.src;
                    if (typeof probe.decode === 'function') {
                        probe.decode().catch(() => {});
                    }
                }
                preloadedUntil = end;
            };

            preloadBatch();

            let preloadTicking = false;
            const preloadOnScroll = () => {
                if (preloadTicking) return;
                preloadTicking = true;
                requestAnimationFrame(() => {
                    preloadTicking = false;
                    const remaining = detailImages.length - preloadedUntil;
                    if (remaining <= 0) return;
                    const nearBottom = window.scrollY + window.innerHeight * 3 > document.documentElement.scrollHeight;
                    if (nearBottom) preloadBatch(4);
                });
            };
            window.addEventListener('scroll', preloadOnScroll, { passive: true });

            if (!firstImage) {
                revealDetail();
            } else if (firstImage.complete) {"""
          if marker not in s:
              raise SystemExit('reveal marker not found')
          s = s.replace(marker, insert, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          rm -f .github/workflows/try-progressive-images.yml
          git add .github/workflows/try-progressive-images.yml
          git commit -m 'Try progressive image preload [progressive-preload]'
          git push