name: Fix leaves video URL

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and update index.html
        run: |
          git show 00791913cca968eddb412aa7236c4271ee15ca27:index.html > index.html
          sed -i 's#https://theme-switch.pages.dev/assets/leaves.mp4#./assets/leaves.mp4#g' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use local leaves video asset' || exit 0
          git push
