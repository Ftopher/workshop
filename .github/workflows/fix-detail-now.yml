name: Fix detail flash now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index.html
        run: |
          cat > /tmp/fix.py <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          marker = "            // 详情页解除 DOM 隐藏，再触发淡入"
          end_marker = "        function closeDetail()"
          start = s.find(marker)
          end = s.find(end_marker, start)

          if start >= 0 and end > start:
              new_block = '''            // 详情页先保持隐藏，等首张大图完成加载/解码后再淡入，避免 End 闪现。
            detailView.style.display = 'block';

            const revealDetail = () => {
                detailView.classList.remove('view-hidden');
                detailView.classList.add('view-visible');
                backLayer.classList.remove('opacity-0');
                backLayer.classList.add('opacity-100');
            };

            const firstImage = heroWrapper.querySelector('img');
            if (!firstImage) {
                revealDetail();
            } else if (firstImage.complete) {
                if (typeof firstImage.decode === 'function') {
                    firstImage.decode().catch(() => {}).finally(revealDetail);
                } else {
                    revealDetail();
                }
            } else {
                let revealed = false;
                const revealOnce = () => {
                    if (revealed) return;
                    revealed = true;
                    revealDetail();
                };
                firstImage.addEventListener('load', () => {
                    if (typeof firstImage.decode === 'function') {
                        firstImage.decode().catch(() => {}).finally(revealOnce);
                    } else {
                        revealOnce();
                    }
                }, { once: true });
                firstImage.addEventListener('error', revealOnce, { once: true });
                setTimeout(revealOnce, 1500);
            }

'''
              s = s[:start] + new_block + s[end:]
              p.write_text(s, encoding="utf-8")
              print("detail reveal patched")
          else:
              print("detail reveal already patched or marker missing")
          PY
          python /tmp/fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix detail page reveal flash'
          git push
