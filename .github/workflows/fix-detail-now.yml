name: Fix detail flash now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""            // 详情页解除 DOM 隐藏，再触发淡入
            detailView.style.display = 'block';
            setTimeout(() => {
                detailView.classList.remove('view-hidden');
                detailView.classList.add('view-visible');
                
                // 返回按钮渐显
                backLayer.classList.remove('opacity-0');
                backLayer.classList.add('opacity-100');
            }, 50);"""
          new="""            // 详情页先保持隐藏，等首张大图完成加载/解码后再淡入，避免 End 闪现。
            detailView.style.display = 'block';

            const revealDetail = () => {
                detailView.classList.remove('view-hidden');
                detailView.classList.add('view-visible');
                backLayer.classList.remove('opacity-0');
                backLayer.classList.add('opacity-100');
            };

            const firstImage = heroWrapper.querySelector('img');
            if (!firstImage) {
                revealDetail();
            } else if (firstImage.complete) {
                if (typeof firstImage.decode === 'function') {
                    firstImage.decode().catch(() => {}).finally(revealDetail);
                } else {
                    revealDetail();
                }
            } else {
                let revealed = false;
                const revealOnce = () => {
                    if (revealed) return;
                    revealed = true;
                    revealDetail();
                };
                firstImage.addEventListener('load', () => {
                    if (typeof firstImage.decode === 'function') {
                        firstImage.decode().catch(() => {}).finally(revealOnce);
                    } else {
                        revealOnce();
                    }
                }, { once: true });
                firstImage.addEventListener('error', revealOnce, { once: true });
                setTimeout(revealOnce, 1500);
            }"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix detail page reveal flash'
          git push
