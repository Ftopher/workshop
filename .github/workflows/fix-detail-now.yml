name: Fix detail flash now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern = r"            detailView\.style\.display = 'block';\s*setTimeout\(\(\) => \{.*?\n            \}, 50\);"
          replacement = '''            detailView.style.display = 'block';

            const revealDetail = () => {
                detailView.classList.remove('view-hidden');
                detailView.classList.add('view-visible');
                backLayer.classList.remove('opacity-0');
                backLayer.classList.add('opacity-100');
            };

            const firstImage = heroWrapper.querySelector('img');
            if (!firstImage) {
                revealDetail();
            } else if (firstImage.complete) {
                if (typeof firstImage.decode === 'function') {
                    firstImage.decode().catch(() => {}).finally(revealDetail);
                } else {
                    revealDetail();
                }
            } else {
                let revealed = false;
                const revealOnce = () => {
                    if (revealed) return;
                    revealed = true;
                    revealDetail();
                };
                firstImage.addEventListener('load', () => {
                    if (typeof firstImage.decode === 'function') {
                        firstImage.decode().catch(() => {}).finally(revealOnce);
                    } else {
                        revealOnce();
                    }
                }, { once: true });
                firstImage.addEventListener('error', revealOnce, { once: true });
                setTimeout(revealOnce, 1500);
            }'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit(f'patch target not found, matches={n}')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix detail page reveal flash'
          git push
