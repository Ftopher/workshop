name: home preload 2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = "        function getProjectThumbnail(projectId, layer) {"
          if "function preloadDetailImagesFromHome()" not in s:
              code = '''        function preloadDetailImagesFromHome() {
            const urls = [
                ...Array.from({length: 14}, (_, i) => `pj1/${i + 1}.jpg`),
                ...Array.from({length: 47}, (_, i) => `pj2/${String(i + 1).padStart(2, '0')}.jpg`),
                ...Array.from({length: 31}, (_, i) => `pj3/${i + 49}.jpg`)
            ];
            let index = 0;
            const warmBatch = () => {
                for (let i = 0; i < 4 && index < urls.length; i++, index++) {
                    const image = new Image();
                    image.decoding = 'async';
                    image.src = `./${urls[index]}`;
                }
                if (index < urls.length) {
                    if ('requestIdleCallback' in window) requestIdleCallback(warmBatch, {timeout: 1000});
                    else setTimeout(warmBatch, 200);
                }
            };
            warmBatch();
        }

'''
              s = s.replace(marker, code + marker, 1)
              s = s.replace("        renderList();", "        renderList();\n\n        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', preloadDetailImagesFromHome, {once: true});\n        else preloadDetailImagesFromHome();", 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Preload detail images from home'
          git push
