name: Improve detail image rendering
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old_preload = '''        // 首页加载稳定后，在后台预热详情页图片，避免进入详情页或快速滚动时出现空白占位。\n        function preloadDetailImagesFromHome() {\n            const urls = [\n                ...Array.from({ length: 14 }, (_, i) => `pj1/${i + 1}.jpg`),\n                ...Array.from({ length: 47 }, (_, i) => `pj2/${String(i + 1).padStart(2, '0')}.jpg`),\n                ...Array.from({ length: 31 }, (_, i) => `pj3/${i + 49}.jpg`)\n            ];\n\n            let index = 0;\n            const warmBatch = () => {\n                for (let i = 0; i < 4 && index < urls.length; i++, index++) {\n                    const image = new Image();\n                    image.decoding = 'async';\n                    image.src = `./${urls[index]}`;\n                }\n\n                if (index < urls.length) {\n                    if ('requestIdleCallback' in window) {\n                        requestIdleCallback(warmBatch, { timeout: 1000 });\n                    } else {\n                        setTimeout(warmBatch, 200);\n                    }\n                }\n            };\n\n            warmBatch();\n        }\n\n        // 不阻塞首页首屏：页面稳定后再开始后台预热。\n        setTimeout(preloadDetailImagesFromHome, 1800);'''

          new_preload = '''        // 首页稳定后，在后台预热详情页图片。除了提前下载，还会低并发 decode，\n        // 并保留 Image 引用，减少“已下载但滚动到这里才开始解码”的空白闪现。\n        const detailWarmImages = [];\n        const detailWarmState = new WeakSet();\n\n        function preloadDetailImagesFromHome() {\n            const urls = [\n                ...Array.from({ length: 14 }, (_, i) => `pj1/${i + 1}.jpg`),\n                ...Array.from({ length: 47 }, (_, i) => `pj2/${String(i + 1).padStart(2, '0')}.jpg`),\n                ...Array.from({ length: 31 }, (_, i) => `pj3/${i + 49}.jpg`)\n            ];\n\n            let index = 0;\n            const warmBatch = () => {\n                const batch = [];\n                for (let i = 0; i < 2 && index < urls.length; i++, index++) {\n                    const image = new Image();\n                    image.decoding = 'async';\n                    image.fetchPriority = 'low';\n                    image.src = `./${urls[index]}`;\n                    detailWarmImages.push(image);\n                    batch.push(image);\n                }\n\n                // 首页空闲时才做 decode，避免影响首屏交互。\n                Promise.all(batch.map(image => {\n                    if (typeof image.decode !== 'function') return Promise.resolve();\n                    return image.decode().catch(() => {});\n                })).finally(() => {\n                    if (index < urls.length) {\n                        if ('requestIdleCallback' in window) {\n                            requestIdleCallback(warmBatch, { timeout: 1500 });\n                        } else {\n                            setTimeout(warmBatch, 300);\n                        }\n                    }\n                });\n            };\n\n            warmBatch();\n        }\n\n        // 对当前详情页附近的图片优先 decode，专门应对拖动右侧滚动条瞬间跳跃。\n        function prioritizeVisibleDetailImages() {\n            const images = document.querySelectorAll('#detail-hero .erp-detail-img');\n            const viewportTop = window.scrollY;\n            const viewportBottom = viewportTop + window.innerHeight;\n            const candidates = [];\n\n            images.forEach(image => {\n                const rect = image.getBoundingClientRect();\n                const top = rect.top + window.scrollY;\n                const bottom = rect.bottom + window.scrollY;\n                const distance = top > viewportBottom ? top - viewportBottom : (viewportTop > bottom ? viewportTop - bottom : 0);\n                if (distance < window.innerHeight * 3) {\n                    candidates.push({ image, distance });\n                }\n            });\n\n            candidates.sort((a, b) => a.distance - b.distance);\n            candidates.slice(0, 6).forEach(({ image }) => {\n                if (detailWarmState.has(image)) return;\n                detailWarmState.add(image);\n                if (typeof image.decode === 'function' && !image.complete) {\n                    image.decode().catch(() => {});\n                } else if (typeof image.decode === 'function') {\n                    image.decode().catch(() => {});\n                }\n            });\n        }\n\n        let detailScrollRaf = 0;\n        window.addEventListener('scroll', () => {\n            if (detailScrollRaf) return;\n            detailScrollRaf = requestAnimationFrame(() => {\n                detailScrollRaf = 0;\n                const detailView = document.getElementById('view-detail');\n                if (detailView && detailView.style.display !== 'none') {\n                    prioritizeVisibleDetailImages();\n                }\n            });\n        }, { passive: true });\n\n        // 不阻塞首页首屏：页面稳定后再开始后台预热。\n        setTimeout(preloadDetailImagesFromHome, 1800);'''

          if old_preload not in s:
              raise SystemExit('preload block not found')
          if 'function prioritizeVisibleDetailImages()' in s:
              raise SystemExit('already patched')
          s = s.replace(old_preload, new_preload, 1)
          s = s.replace("const warmBatch = () => {\n                for (let i = 0; i < 2 && index < urls.length; i++, index++) {", "const warmBatch = () => {\n                for (let i = 0; i < 2 && index < urls.length; i++, index++) {", 1)
          p.write_text(s)
          PY
      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Improve detail image preloading and decode"
          git push
