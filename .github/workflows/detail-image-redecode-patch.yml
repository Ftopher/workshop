name: Detail image re-decode optimization

on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          old_state = "const detailWarmState = new WeakSet();"
          new_state = "const detailWarmLastDecode = new WeakMap();"
          if old_state not in s:
              raise SystemExit('state declaration not found')
          s = s.replace(old_state, new_state, 1)
          pattern = r"        function prioritizeVisibleDetailImages\(\) \{.*?        \}\n\n        let detailScrollRaf = 0;"
          replacement = '''        function prioritizeVisibleDetailImages(force = false) {
            const images = document.querySelectorAll('#detail-hero .erp-detail-img');
            const viewportTop = window.scrollY;
            const viewportBottom = viewportTop + window.innerHeight;
            const candidates = [];

            images.forEach(image => {
                const rect = image.getBoundingClientRect();
                const top = rect.top + window.scrollY;
                const bottom = rect.bottom + window.scrollY;
                const distance = top > viewportBottom ? top - viewportBottom : (viewportTop > bottom ? viewportTop - bottom : 0);
                if (distance < window.innerHeight * 3) {
                    candidates.push({ image, distance });
                }
            });

            candidates.sort((a, b) => a.distance - b.distance);
            candidates.slice(0, 6).forEach(({ image }) => {
                if (typeof image.decode !== 'function') return;

                const now = performance.now();
                const lastDecode = detailWarmLastDecode.get(image) || 0;
                if (!force && now - lastDecode < 180) return;

                detailWarmLastDecode.set(image, now);
                image.decode().catch(() => {});
            });
        }

        let detailScrollRaf = 0;'''
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('prioritize function not found')
          marker = "      const firstImage = heroWrapper.querySelector('img');\n  if (!firstImage) {"
          repl = "      const firstImage = heroWrapper.querySelector('img');\n  // 进入详情页后立即预热当前视口附近图片，避免第一次快速跳跃时临时解码。\n  requestAnimationFrame(() => prioritizeVisibleDetailImages(true));\n  if (!firstImage) {"
          if marker not in s:
              raise SystemExit('firstImage marker not found')
          s = s.replace(marker, repl, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "[auto] Improve detail image re-decode during fast scrolling"
          git push
