name: Improve detail image re-decode
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          if 'const detailWarmLastDecode = new WeakMap();' in s:
              print('Already patched; nothing to do.')
              raise SystemExit(0)
          old_state = 'const detailWarmState = new WeakSet();'
          if old_state not in s:
              raise SystemExit('state declaration not found')
          s = s.replace(old_state, 'const detailWarmLastDecode = new WeakMap();', 1)
          old_fn = '''        function prioritizeVisibleDetailImages() {\n            const images = document.querySelectorAll('#detail-hero .erp-detail-img');\n            const viewportTop = window.scrollY;\n            const viewportBottom = viewportTop + window.innerHeight;\n            const candidates = [];\n\n            images.forEach(image => {\n                const rect = image.getBoundingClientRect();\n                const top = rect.top + window.scrollY;\n                const bottom = rect.bottom + window.scrollY;\n                const distance = top > viewportBottom ? top - viewportBottom : (viewportTop > bottom ? viewportTop - bottom : 0);\n                if (distance < window.innerHeight * 3) {\n                    candidates.push({ image, distance });\n                }\n            });\n\n            candidates.sort((a, b) => a.distance - b.distance);\n            candidates.slice(0, 6).forEach(({ image }) => {\n                if (detailWarmState.has(image)) return;\n                detailWarmState.add(image);\n                if (typeof image.decode === 'function' && !image.complete) {\n                    image.decode().catch(() => {});\n                } else if (typeof image.decode === 'function') {\n                    image.decode().catch(() => {});\n                }\n            });\n        }'''
          new_fn = '''        function prioritizeVisibleDetailImages(force = false) {\n            const images = document.querySelectorAll('#detail-hero .erp-detail-img');\n            const viewportTop = window.scrollY;\n            const viewportBottom = viewportTop + window.innerHeight;\n            const candidates = [];\n\n            images.forEach(image => {\n                const rect = image.getBoundingClientRect();\n                const top = rect.top + window.scrollY;\n                const bottom = rect.bottom + window.scrollY;\n                const distance = top > viewportBottom ? top - viewportBottom : (viewportTop > bottom ? viewportTop - bottom : 0);\n                if (distance < window.innerHeight * 3) {\n                    candidates.push({ image, distance });\n                }\n            });\n\n            candidates.sort((a, b) => a.distance - b.distance);\n            candidates.slice(0, 6).forEach(({ image }) => {\n                if (typeof image.decode !== 'function') return;\n                const now = performance.now();\n                const lastDecode = detailWarmLastDecode.get(image) || 0;\n                if (!force && now - lastDecode < 180) return;\n                detailWarmLastDecode.set(image, now);\n                image.decode().catch(() => {});\n            });\n        }'''
          if old_fn not in s:
              raise SystemExit('prioritize function not found')
          s = s.replace(old_fn, new_fn, 1)
          p.write_text(s)
          PY
      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Improve detail image re-decode during fast scrolling"
          git push
