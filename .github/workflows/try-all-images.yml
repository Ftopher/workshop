name: test-all-detail-images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[all-images]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """                images.forEach((img, index) => {\n                    const loading = index === 0 ? 'eager' : 'lazy';\n                    imgHtml += `<img src=\"./${img}\" class=\"erp-detail-img w-full h-auto bg-[#E8E5DF] block\" alt=\"${img}\" loading=\"${loading}\">`;\n                });"""
          new = """                images.forEach((img, index) => {\n                    imgHtml += `<img src=\"./${img}\" class=\"erp-detail-img w-full h-auto bg-[#E8E5DF] block\" alt=\"${img}\" loading=\"eager\" decoding=\"async\"${index === 0 ? ' fetchpriority=\"high\"' : ''}>`;\n                });"""
          if old in s:
              s = s.replace(old, new, 1)
          else:
              old2 = """                images.forEach((img, index) => {\n                    const loading = index < 4 ? 'eager' : 'lazy';\n                    imgHtml += `<img src=\"./${img}\" class=\"erp-detail-img w-full h-auto bg-[#E8E5DF] block\" alt=\"${img}\" loading=\"${loading}\" data-detail-index=\"${index}\">`;\n                });"""
              if old2 not in s:
                  raise SystemExit('image template not found')
              s = s.replace(old2, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          rm -f .github/workflows/try-all-images.yml
          git add .github/workflows/try-all-images.yml
          git commit -m 'Load all detail images in background [all-images]'
          git push